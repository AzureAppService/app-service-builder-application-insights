name: Validate Application Insights sample

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore pinned dependencies
        run: dotnet restore tests/Sample.Tests.csproj --configfile NuGet.Config --locked-mode
      - name: Test endpoint, redaction and exporter behavior
        run: dotnet test tests/Sample.Tests.csproj --no-restore --verbosity minimal
      - name: Publish application
        run: dotnet publish BuilderApplicationInsightsSample.csproj --no-restore -c Release
      - name: Check formatting
        run: dotnet format whitespace tests/Sample.Tests.csproj --no-restore --verify-no-changes --verbosity quiet
      - name: Compile monitoring and source-free app templates
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/sample.bicep --stdout > /dev/null
