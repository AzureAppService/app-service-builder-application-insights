name: Validate Application Insights sample

on:
  push:
    branches: [main, sample-ux-refresh]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore pinned dependencies
        run: dotnet restore tests/Sample.Tests.csproj --configfile NuGet.Config --locked-mode
      - name: Test endpoint, redaction and exporter behavior
        run: dotnet test tests/Sample.Tests.csproj --no-restore --verbosity minimal
      - name: Publish application
        run: dotnet publish BuilderApplicationInsightsSample.csproj --no-restore -c Release
      - name: Check formatting
        run: dotnet format whitespace tests/Sample.Tests.csproj --no-restore --verify-no-changes --verbosity quiet
      - name: Compile templates and verify secure configuration dependency
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/sample.bicep --stdout | jq -e '
            .resources.monitoring.properties.template.outputs.applicationInsightsConnectionString.type == "securestring"
            and (.resources.app.dependsOn | index("monitoring") != null)
            and (.resources.app.properties.versionConfiguration.variables[]
              | select(.name == "APPLICATIONINSIGHTS_CONNECTION_STRING")
              | .value | startswith("[listOutputsWithSecureValues("))
          ' > /dev/null
